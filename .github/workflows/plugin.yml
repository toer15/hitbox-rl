name: Build Hitbox bridge plugin

on:
  push:
    branches: [main]
    paths:
      - 'bakkesmod-plugin/**'
      - '.github/workflows/plugin.yml'
  pull_request:
    paths:
      - 'bakkesmod-plugin/**'
  workflow_dispatch:
  release:
    types: [published]

jobs:
  Build:
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build Release x64
        shell: cmd
        run: msbuild bakkesmod-plugin\HitboxBridge.vcxproj /p:Platform=x64 /p:Configuration=Release /flp:logfile=build.log;verbosity=normal
        continue-on-error: true

      - name: Locate and verify the built dll
        id: locate
        if: always()
        shell: pwsh
        run: |
          $dll = Get-ChildItem -Path . -Recurse -Filter 'HitboxBridge.dll' |
            Where-Object { $_.FullName -notmatch 'node_modules' } |
            Select-Object -First 1
          if (-not $dll) {
            Get-ChildItem -Path . -Recurse -Include '*.dll','*.log' |
              Where-Object { $_.FullName -notmatch 'node_modules' } |
              ForEach-Object { $_.FullName } | Out-File $env:GITHUB_STEP_SUMMARY -Append
            Write-Error 'HitboxBridge.dll was not built.'
          }
          "dll_path=$($dll.FullName)" | Out-File $env:GITHUB_OUTPUT -Append

      - name: Upload plugin artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HitboxBridge
          path: ${{ steps.locate.outputs.dll_path }}

      - name: Attach plugin to release
        if: github.event_name == 'release'
        shell: pwsh
        run: |
          gh release upload ${{ github.event.release.tag_name }} "${{ steps.locate.outputs.dll_path }}" --clobber
        env:
          GH_TOKEN: ${{ github.token }}
