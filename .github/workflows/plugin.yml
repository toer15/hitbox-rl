name: Build Hitbox bridge plugin

on:
  push:
    branches: [main]
    paths:
      - 'bakkesmod-plugin/**'
      - '.github/workflows/plugin.yml'
  pull_request:
    paths:
      - 'bakkesmod-plugin/**'
  workflow_dispatch:
  release:
    types: [published]

jobs:
  Build:
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build Release x64
        shell: cmd
        run: msbuild bakkesmod-plugin\HitboxBridge.vcxproj /p:Platform=x64 /p:Configuration=Release /flp:logfile=build.log;verbosity=normal
        continue-on-error: true

      - name: Publish errors to job summary
        if: always()
        shell: pwsh
        run: |
          if (Test-Path build.log) {
            $lines = Get-Content build.log
            $errors = $lines | Select-String -Pattern 'error' -Context 2,4
            if ($errors) {
              "### MSBuild errors" | Out-File $env:GITHUB_STEP_SUMMARY -Append
              $errors | ForEach-Object { "``````"; $_.Context.PreContext; $_.Line; $_.Context.PostContext; "``````" } |
                Out-File $env:GITHUB_STEP_SUMMARY -Append
            } else {
              "No 'error' lines found in build.log. Last 40 lines:" | Out-File $env:GITHUB_STEP_SUMMARY -Append
              "``````" | Out-File $env:GITHUB_STEP_SUMMARY -Append
              $lines | Select-Object -Last 40 | Out-File $env:GITHUB_STEP_SUMMARY -Append
              "``````" | Out-File $env:GITHUB_STEP_SUMMARY -Append
            }
          } else {
            "build.log was not created." | Out-File $env:GITHUB_STEP_SUMMARY -Append
          }

      - name: Fail if the dll was not produced
        shell: pwsh
        run: |
          if (-not (Test-Path 'bakkesmod-plugin/Build/x64/Release/HitboxBridge.dll')) {
            Write-Error 'HitboxBridge.dll was not built.'
          }

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: HitboxBridge
          path: bakkesmod-plugin/Build/x64/Release/HitboxBridge.dll

      - name: Attach plugin to release
        if: github.event_name == 'release'
        shell: pwsh
        run: |
          gh release upload ${{ github.event.release.tag_name }} bakkesmod-plugin/Build/x64/Release/HitboxBridge.dll --clobber
        env:
          GH_TOKEN: ${{ github.token }}
